<div class="container">
  <app-breadcrumb
    class="my-3 ms-3"
    [breadcrumb]="[
      { label: 'Home', link: '/home' },
      { label: 'Cart', link: '' }
    ]"
  ></app-breadcrumb>

  <h1 class="header mt-5">Your Cart</h1>

  @if (cartCount === 0) {
    <div class="empty-cart">You have no items in your cart</div>
  }
  @if (cartCount > 0) {
    <div class="container">
      <ul class="cart">
        @for (product of getCartProducts(); track product) {
          <li class="cart-item">
            <app-cart-detail [product]="product" (buttonPressed)="removeFromCart($event)"></app-cart-detail>
          </li>
        }
      </ul>
      <div class="total">Total: Wu{{ cartTotal | currency }}</div>
      <button class="btn btn-success order-btn" routerLink="/order">Order</button>
    </div>
  }
</div>
