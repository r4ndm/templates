<nav aria-label="breadcrumb" style="--bs-breadcrumb-divider: '>'">
  <ol class="breadcrumb">
    @for (item of breadcrumb; track item; let isLast = $last) {
      <li
        [ngClass]="{ 'breadcrumb-item': true, active: isLast }"
        [attr.aria-current]="isLast ? 'page' : null"
        >
        @if (!isLast) {
          <a [routerLink]="item.link">{{ item.label }}</a>
        }
        @if (isLast) {
          <a> {{ item.label }} </a>
        }
      </li>
    }
  </ol>
</nav>
